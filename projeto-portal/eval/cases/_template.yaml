agent: meu-agente
cases:
  - input: "Uma entrada normal para a tarefa."
    max_latency_s: 5
    max_chars: 900
    must_contain: ["palavra obrigatoria"]

  - input: "Uma entrada dificil, incompleta ou muito curta."
    max_latency_s: 5
    max_chars: 900
    must_not_contain: ["Traceback", "Exception"]

  - input: ""
    max_latency_s: 5
    max_chars: 300
    must_contain: ["Envie"]
