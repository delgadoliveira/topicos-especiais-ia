<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Os cinco componentes do agente</title>
  <desc id="desc">Arquitetura didática do agente com Persona e Objetivo, Modelo, Memória, Tools mais Executor e Loop de Controle, conectada aos encontros 1 a 6.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172b4d" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#42526e"/>
    </marker>
    <style>
      .title{font:700 48px Inter,Segoe UI,sans-serif;fill:#172b4d}.sub{font:24px Inter,Segoe UI,sans-serif;fill:#5e6c84}
      .tag{font:700 17px Inter,Segoe UI,sans-serif;letter-spacing:1.5px;fill:#5e6c84}.head{font:700 27px Inter,Segoe UI,sans-serif;fill:#172b4d}
      .body{font:21px Inter,Segoe UI,sans-serif;fill:#42526e}.small{font:18px Inter,Segoe UI,sans-serif;fill:#5e6c84}
      .loop{font:700 22px Inter,Segoe UI,sans-serif;fill:#172b4d}.event{font:700 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#172b4d}
      .flow{fill:none;stroke:#42526e;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#7a869a;stroke-width:2;stroke-dasharray:8 9}
    </style>
  </defs>
  <rect width="1600" height="980" rx="36" fill="#f7f9fc"/>
  <text x="80" y="82" class="tag">ARQUITETURA DIDÁTICA · ENCONTROS 5 E 6</text>
  <text x="80" y="145" class="title">Um agente é um sistema, não apenas um prompt</text>
  <text x="80" y="188" class="sub">Cinco componentes cooperam em uma execução observável e limitada.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="255" width="410" height="220" rx="24" fill="#fff4ce" stroke="#f7630c" stroke-width="3"/>
    <text x="115" y="305" class="tag">1 · PERSONA + OBJETIVO</text>
    <text x="115" y="350" class="head">Quem é e qual promessa cumpre</text>
    <text x="115" y="392" class="body">Papel · tarefa · formato · limites</text>
    <text x="115" y="432" class="small">A dupla define · system_prompt</text>

    <rect x="595" y="255" width="410" height="220" rx="24" fill="#cfe4fa" stroke="#0078d4" stroke-width="3"/>
    <text x="630" y="305" class="tag">2 · MODELO / MOTOR</text>
    <text x="630" y="350" class="head">Produz a resposta textual</text>
    <text x="630" y="392" class="body">Simulador offline ou Qwen opcional</text>
    <text x="630" y="432" class="small">O framework fornece · llm.chat()</text>

    <rect x="1110" y="255" width="410" height="220" rx="24" fill="#e8daef" stroke="#5c2d91" stroke-width="3"/>
    <text x="1145" y="305" class="tag">3 · MEMÓRIA</text>
    <text x="1145" y="350" class="head">Recupera contexto recente</text>
    <text x="1145" y="392" class="body">Últimas duas mensagens da pessoa</text>
    <text x="1145" y="432" class="small">A dupla adapta · não é cache</text>

    <rect x="80" y="590" width="500" height="220" rx="24" fill="#dff6dd" stroke="#107c10" stroke-width="3"/>
    <text x="115" y="640" class="tag">4 · TOOLS + EXECUTOR</text>
    <text x="115" y="685" class="head">Age por funções permitidas</text>
    <text x="115" y="727" class="body">Tool calcula blocos de estudo</text>
    <text x="115" y="767" class="small">Dupla cria a tool · template protege</text>

    <rect x="1020" y="590" width="500" height="220" rx="24" fill="#fde7e9" stroke="#d13438" stroke-width="3"/>
    <text x="1055" y="640" class="tag">5 · LOOP DE CONTROLE</text>
    <text x="1055" y="685" class="head">Verifica, repete ou encerra</text>
    <text x="1055" y="727" class="body">No máximo duas tentativas</text>
    <text x="1055" y="767" class="small">Template fornece · dupla testa e explica</text>
  </g>

  <g>
    <rect x="650" y="555" width="300" height="290" rx="145" fill="#fff" stroke="#7a869a" stroke-width="3"/>
    <text x="800" y="616" class="loop" text-anchor="middle">EXECUÇÃO OBSERVÁVEL</text>
    <text x="800" y="666" class="event" text-anchor="middle">OBSERVE</text>
    <text x="800" y="704" class="event" text-anchor="middle">MEMORY → ACT</text>
    <text x="800" y="742" class="event" text-anchor="middle">REFLECT</text>
    <text x="800" y="780" class="event" text-anchor="middle">STOP</text>
    <path d="M 880 674 C 950 715 914 803 835 810" class="flow"/>
  </g>

  <path d="M 490 365 L 585 365" class="flow"/>
  <path d="M 1100 365 L 1015 365" class="flow"/>
  <path d="M 800 475 L 800 545" class="flow"/>
  <path d="M 580 700 L 640 700" class="flow"/>
  <path d="M 960 700 L 1010 700" class="flow"/>
  <path d="M 1270 820 C 1270 910 330 910 330 820" class="dash"/>

  <rect x="80" y="890" width="1440" height="55" rx="14" fill="#eef2f7"/>
  <text x="110" y="925" class="small">E1 Persona + ReAct  ·  E2 Modelo + Tools + Loops  ·  E3 Memória  ·  E4 Falhas + Avaliação  ·  E5 Integração  ·  E6 Evidências + Melhoria</text>
</svg>
