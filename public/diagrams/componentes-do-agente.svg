<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Componentes do agente e responsabilidades do aluno</title>
  <desc id="desc">Diagrama do fluxo entre pessoa, portal, agente do aluno, motor simulado ou API real, resposta, observabilidade, testes e avaliação automática. Rosa indica o que o aluno desenvolve, azul o framework pronto, amarelo os serviços opcionais e verde as evidências.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#3b3a39"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#0078d4"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#f7630c"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity=".11"/>
    </filter>
    <style>
      .title{font:700 42px "Segoe UI",sans-serif;fill:#242424}.subtitle{font:400 21px "Segoe UI",sans-serif;fill:#5c5c5c}
      .lane{font:700 18px "Segoe UI",sans-serif;letter-spacing:1.5px;fill:#5c5c5c}.h{font:700 21px "Segoe UI",sans-serif;fill:#242424}
      .t{font:400 17px "Segoe UI",sans-serif;fill:#3b3a39}.small{font:600 15px "Segoe UI",sans-serif;fill:#3b3a39}
      .micro{font:400 14px "Segoe UI",sans-serif;fill:#5c5c5c}.mono{font:600 15px Consolas,monospace;fill:#242424}
      .ready{fill:#eaf4fd;stroke:#0078d4;stroke-width:3}.student{fill:#fff0f4;stroke:#b11f4b;stroke-width:3}
      .optional{fill:#fff4ce;stroke:#f7630c;stroke-width:3}.evidence{fill:#edf8ed;stroke:#107c10;stroke-width:3}
      .neutral{fill:#fff;stroke:#919191;stroke-width:2}.group{fill:none;stroke-width:3;stroke-dasharray:10 8}
      .flow{fill:none;stroke:#3b3a39;stroke-width:3;marker-end:url(#arrow)}.flowblue{fill:none;stroke:#0078d4;stroke-width:3;marker-end:url(#arrow-blue)}
      .floworange{fill:none;stroke:#f7630c;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#arrow-orange)}
    </style>
  </defs>

  <rect width="1600" height="980" rx="28" fill="#fbfaf8"/>
  <text x="70" y="68" class="title">Como o agente funciona — e qual parte é sua?</text>
  <text x="70" y="105" class="subtitle">A mensagem atravessa um sistema pronto; o aluno projeta a identidade, os limites e a instrução da tarefa.</text>

  <g transform="translate(70 130)">
    <rect x="0" y="0" width="26" height="26" rx="7" class="student"/><text x="38" y="20" class="small">Você desenvolve</text>
    <rect x="220" y="0" width="26" height="26" rx="7" class="ready"/><text x="258" y="20" class="small">Framework pronto</text>
    <rect x="450" y="0" width="26" height="26" rx="7" class="optional"/><text x="488" y="20" class="small">Opcional</text>
    <rect x="610" y="0" width="26" height="26" rx="7" class="evidence"/><text x="648" y="20" class="small">Evidência</text>
  </g>

  <text x="70" y="215" class="lane">1 · JORNADA DA MENSAGEM</text>

  <g filter="url(#shadow)">
    <rect x="70" y="245" width="190" height="116" rx="18" class="neutral"/>
    <text x="95" y="281" class="h">Pessoa</text>
    <text x="95" y="312" class="t">matérias + prazo</text>
    <text x="95" y="339" class="t">+ tempo disponível</text>

    <rect x="320" y="245" width="205" height="116" rx="18" class="ready"/>
    <text x="345" y="281" class="h">Portal</text>
    <text x="345" y="312" class="t">seleciona o agente</text>
    <text x="345" y="339" class="mono">app.py</text>

    <rect x="585" y="230" width="570" height="372" rx="24" class="group" stroke="#b11f4b"/>
    <text x="610" y="267" class="lane" fill="#b11f4b">AGENTE DO ALUNO · run(message, history)</text>

    <rect x="610" y="290" width="240" height="118" rx="16" class="student"/>
    <text x="632" y="326" class="h">A · Identidade</text>
    <text x="632" y="356" class="mono">slug · name · emoji</text>
    <text x="632" y="383" class="mono">description</text>

    <rect x="890" y="290" width="240" height="118" rx="16" class="student"/>
    <text x="912" y="326" class="h">B · Guardrails</text>
    <text x="912" y="356" class="t">entrada vazia, longa</text>
    <text x="912" y="383" class="t">ou fora do escopo</text>

    <rect x="610" y="438" width="240" height="118" rx="16" class="student"/>
    <text x="632" y="474" class="h">C · Instrução</text>
    <text x="632" y="504" class="t">papel + tarefa</text>
    <text x="632" y="531" class="t">formato + limites</text>

    <rect x="890" y="438" width="240" height="118" rx="16" class="student"/>
    <text x="912" y="474" class="h">D · Resposta</text>
    <text x="912" y="504" class="t">formata answer</text>
    <text x="912" y="531" class="t">e registra steps</text>

    <rect x="1220" y="245" width="310" height="116" rx="18" class="ready"/>
    <text x="1245" y="281" class="h">AgentResult</text>
    <text x="1245" y="312" class="mono">answer · steps</text>
    <text x="1245" y="339" class="mono">citations · error</text>
  </g>

  <path d="M260 303 H320" class="flow"/>
  <path d="M525 303 H585" class="flow"/>
  <path d="M1155 303 H1220" class="flow"/>

  <text x="70" y="650" class="lane">2 · QUEM PRODUZ A RESPOSTA</text>
  <rect x="70" y="680" width="1460" height="138" rx="24" class="group" stroke="#0078d4"/>
  <text x="95" y="714" class="small">O framework escolhe automaticamente:</text>

  <rect x="95" y="734" width="245" height="62" rx="14" class="ready"/>
  <text x="118" y="760" class="h">llm.chat()</text>
  <text x="118" y="782" class="micro">roteador pronto</text>

  <rect x="405" y="726" width="300" height="78" rx="14" class="ready"/>
  <text x="430" y="755" class="h">Simulador determinístico</text>
  <text x="430" y="780" class="t">padrão · offline · 0 chamadas</text>

  <rect x="770" y="726" width="300" height="78" rx="14" class="optional"/>
  <text x="795" y="755" class="h">API Hugging Face · Qwen</text>
  <text x="795" y="780" class="t">opcional · até 3 chamadas</text>

  <rect x="1135" y="726" width="240" height="78" rx="14" class="ready"/>
  <text x="1160" y="755" class="h">Cache</text>
  <text x="1160" y="780" class="t">reaproveita resposta</text>

  <rect x="1410" y="726" width="95" height="78" rx="14" class="optional"/>
  <text x="1433" y="754" class="small">Falhou?</text>
  <text x="1425" y="780" class="micro">volta ao mock</text>

  <path d="M340 765 H405" class="flowblue"/>
  <path d="M340 765 C365 690 740 690 770 726" class="floworange"/>
  <path d="M1070 765 H1135" class="flowblue"/>
  <path d="M1070 745 C1190 680 1380 680 1410 745" class="floworange"/>
  <path d="M1410 790 C1320 845 610 845 555 804" class="floworange"/>

  <text x="70" y="865" class="lane">3 · EVIDÊNCIAS QUE MOSTRAM QUE FUNCIONA</text>
  <g filter="url(#shadow)">
    <rect x="70" y="892" width="300" height="64" rx="16" class="student"/>
    <text x="92" y="919" class="h">Casos + ZIP do aluno</text>
    <text x="92" y="943" class="t">cases.yaml · agent.py</text>

    <rect x="440" y="892" width="315" height="64" rx="16" class="ready"/>
    <text x="462" y="919" class="h">Avaliação automática</text>
    <text x="462" y="943" class="t">segurança · testes · latência</text>

    <rect x="825" y="892" width="315" height="64" rx="16" class="evidence"/>
    <text x="847" y="919" class="h">Observabilidade</text>
    <text x="847" y="943" class="mono">steps · modo · duração</text>

    <rect x="1210" y="892" width="320" height="64" rx="16" class="evidence"/>
    <text x="1232" y="919" class="h">Registro para o professor</text>
    <text x="1232" y="943" class="t">conceito + justificativa · SQLite/CSV</text>
  </g>
  <path d="M370 924 H440" class="flow"/>
  <path d="M755 924 H825" class="flow"/>
  <path d="M1140 924 H1210" class="flow"/>
</svg>
